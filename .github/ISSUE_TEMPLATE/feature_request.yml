name: Feature request
description: Propose a scoped installer improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should the installer solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and privilege impact
      description: Include new sources, sudo operations, services, ports, or credentials.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Supported target
      options:
        - All supported distributions
        - Arch Linux
        - CachyOS
        - EndeavourOS
        - Experimental distribution
    validations:
      required: true
